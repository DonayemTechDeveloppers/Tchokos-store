; Les formulaires Filament (ReelResource, MediaResource, MediaRelationManager) sont
; calibrés sur maxSize(38000) Ko (~37 Mo) pour les vidéos, en respectant une marge
; sous ces limites. Sans ce fichier, PHP utilise ses valeurs par défaut compilées
; (upload_max_filesize=2M, post_max_size=8M), trop basses pour les vidéos (reels).
upload_max_filesize = 40M
post_max_size = 40M
memory_limit = 256M
